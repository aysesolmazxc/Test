name: win 11 + tailscale + Download.bat script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-Tailscale" `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 | Out-Null

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        shell: pwsh
        run: |
          $password = "runneradmin"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires | Out-Null
          }
          else {
              Set-LocalUser -Name "RDP" -Password $securePass -ErrorAction SilentlyContinue
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          "RDP_USER=RDP" >> $env:GITHUB_ENV
          "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install and Connect Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/qn", "/norestart" -Wait
          Remove-Item $installerPath -Force

          Start-Service -Name Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $tsCli = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tsCli up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $tsIP = $null
          for ($i = 0; $i -lt 15; $i++) {
              $ipOut = & $tsCli ip -4 2>$null
              if ($ipOut) {
                  $tsIP = ($ipOut | Select-Object -First 1).ToString().Trim()
                  if ($tsIP) { break }
              }
              Start-Sleep -Seconds 4
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IPv4 address was not assigned in time."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Port Locally
        shell: pwsh
        run: |
          $check = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $check.TcpTestSucceeded) {
              Write-Error "Port 3389 is not listening on Tailscale IP $env:TAILSCALE_IP."
              exit 1
          }
          Write-Host "RDP port 3389 reachable on $env:TAILSCALE_IP"

      - name: Stage Downloads.bat and Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "=================="

          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $stagedScript = "$env:TEMP\Downloads.bat"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $stagedScript -UseBasicParsing

          while ($true) {
              $rdpProfile = "C:\Users\RDP"
              if (Test-Path $rdpProfile) {
                  $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
                  New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                  Copy-Item -Path $stagedScript -Destination "$startupPath\Downloads.bat" -Force
                  Write-Host "Copied Downloads.bat to $startupPath"
                  break
              }
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Waiting for first RDP login to create C:\Users\RDP..."
              Start-Sleep -Seconds 20
          }

          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Runner active..."
              Start-Sleep -Seconds 300
          }
